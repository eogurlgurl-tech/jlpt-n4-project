<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JLPT N4 합격 프로젝트</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="header">

    <h1>JLPT N4 합격 프로젝트</h1>

    <p>180일 완주 목표</p>

</header>

<nav class="main-nav">

    <button class="tab-btn active" data-tab="dashboard">
        대시보드
    </button>

    <button class="tab-btn" data-tab="grammar">
        문법
    </button>

    <button class="tab-btn" data-tab="vocab">
        단어
    </button>

    <button class="tab-btn" data-tab="kanji">
        한자
    </button>

    <button class="tab-btn" data-tab="favorite">
        오답노트
    </button>

</nav>

<main>

<!-- DASHBOARD -->

<section id="dashboardTab">

    <section class="dashboard-card">

        <h2>DAY 진행률</h2>

        <div id="dayCounter">
            DAY 1 / 180
        </div>

    </section>

    <section class="dashboard-card">

        <h2>오늘 학습</h2>
        
        <div id="todayStudyArea"></div>

    </section>

    <section class="dashboard-card">

        <h2>현재 진행률</h2>

        <div class="progress-item">

            문법

            <span id="grammarProgress">
                0%
            </span>

        </div>

        <div class="progress-item">

            단어

            <span id="vocabProgress">
                0%
            </span>

        </div>

        <div class="progress-item">

            한자

            <span id="kanjiProgress">
                0%
            </span>

        </div>

    </section>

    <section class="dashboard-card">

        <h2>예상 합격 레벨</h2>

        <div id="jlptLevel">

            JLPT N5 준비중

        </div>

    </section>

    <button id="startBtn">

        오늘 학습 시작

    </button>

</section>

<!-- GRAMMAR -->

<section id="grammarTab" style="display:none">

    <section class="dashboard-card">

        <h2>문법 학습</h2>

        <div id="grammarCard">

        </div>

        <div class="card-nav">

            <button id="grammarPrev">
                ← 이전
            </button>

            <button id="grammarRandom">
                🎲 랜덤
            </button>

            <button id="grammarNext">
                다음 →
            </button>

        </div>

    </section>

</section>

<!-- VOCAB -->

<section id="vocabTab" style="display:none">

    <section class="dashboard-card">

        <h2>단어 학습</h2>

        <div id="vocabCard">

        </div>

        <div class="card-nav">

            <button id="vocabPrev">
                ← 이전
            </button>

            <button id="vocabRandom">
                🎲 랜덤
            </button>

            <button id="vocabNext">
                다음 →
            </button>

        </div>

    </section>

</section>

<!-- KANJI -->

<section id="kanjiTab" style="display:none">

    <section class="dashboard-card">

        <h2>한자 학습</h2>

        <div id="kanjiCard">

        </div>

        <div class="card-nav">

            <button id="kanjiPrev">
                ← 이전
            </button>

            <button id="kanjiRandom">
                🎲 랜덤
            </button>

            <button id="kanjiNext">
                다음 →
            </button>

        </div>

    </section>

</section>

<section id="favoriteTab" style="display:none">

    <section class="dashboard-card">

        <h2>⭐ 오답노트</h2>

        <div id="favoriteArea">

        </div>

    </section>

</section>

</main>


<script src="js/grammar.js"></script>
<script src="js/vocab.js"></script>
<script src="js/kanji.js"></script>
<script src="js/study-engine.js"></script>
<script src="js/app.js"></script>


</body>
</html>
